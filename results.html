<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillPath — Career Recommendations</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">SkillPath</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="assessment.html">Assessment</a></li>
        <li><a href="results.html" class="active">Recommendations</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Recommendations Section -->
  <main class="container">
    <div class="page-header">
      <h1>Your Career Recommendations</h1>
      <p>
        Careers are ranked from highest to lowest match based on your selected
        skills and interests.
      </p>
    </div>

    <!-- Summary of what the user selected (filled by script.js) -->
    <section id="summaryBanner" class="summary-banner"></section>

    <!-- Recommended career cards appear here (filled by script.js) -->
    <section id="resultsContainer"></section>

    <!-- Navigation Buttons -->
    <div class="form-actions">
      <a href="assessment.html" class="btn btn-primary">Retake Assessment</a>
      <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>SkillPath &copy; 2026 — Skill-Based Career Recommendation Website</p>
    </div>
  </footer>

  <!-- Load dataset first, then load script logic -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
